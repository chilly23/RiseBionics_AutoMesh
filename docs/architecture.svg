<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Atlas-to-mesh pipeline</title>
<desc id="architecture-desc">Curated image regions select faces through their UV coordinates.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="48" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#2d3142">Atlas-to-mesh pipeline</text>
<text x="40" y="76" font-family="Geist, Arial, sans-serif" font-size="11" fill="#5a6580">Curated image regions select faces through their UV coordinates.</text>
<path d="M 264,192 H 352" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 576,192 H 688" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 800,232 V 392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 688,432 H 576" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 352,432 H 264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<g data-node="OBJ + MTL + texture"><rect x="40" y="152" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="56" y="170" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">INPUT</text>
<text x="56" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">OBJ + MTL + texture</text>
<text x="56" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Supplied assessment assets</text>
</g>
<g data-node="Load mesh and atlas"><rect x="352" y="152" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="368" y="170" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">STEP 01</text>
<text x="368" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Load mesh and atlas</text>
<text x="368" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">UV coordinates required</text>
</g>
<g data-node="Refine region masks"><rect x="688" y="152" width="224" height="80" rx="6" fill="#f2e7e2" stroke="#bf4520" stroke-width="1.8"/>
<text x="704" y="170" fill="#bf4520" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">CORE</text>
<text x="704" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Refine region masks</text>
<text x="704" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Predefined E / C / S areas</text>
</g>
<g data-node="Select mesh faces"><rect x="688" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="704" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">STEP 03</text>
<text x="704" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Select mesh faces</text>
<text x="704" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">UV mapping / connected regions</text>
</g>
<g data-node="Apply geometry operations"><rect x="352" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="368" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">STEP 04</text>
<text x="368" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Apply geometry operations</text>
<text x="368" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Extrude / pocket / preserve</text>
</g>
<g data-node="Export mesh variants"><rect x="40" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="56" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">OUTPUT</text>
<text x="56" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Export mesh variants</text>
<text x="56" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">OBJ / images / region summary</text>
</g>
<line x1="40" y1="548" x2="920" y2="548" stroke="#4f5d75" stroke-width="0.7"/>
<text x="40" y="568" font-family="Geist, Arial, sans-serif" font-size="10" fill="#5a6580">Optional cube Boolean operations create union and difference variants of the combined mesh.</text>
<text x="40" y="588" font-family="Geist Mono, Consolas, monospace" font-size="8" fill="#5a6580">ARROWS: DATA OR DEPENDENCY DIRECTION   /   SOURCE: REPOSITORY FILES</text>
</svg>
